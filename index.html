<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD100">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cân nhanh · Phế Liệu Trung Hiếu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000; --soft:#262626; --line:#000000;
  --signal:#FFD100; --signal-deep:#E6B800;
  --warn:#C4001A; --cash:#00652B; --bank:#0033A0; --debt:#9A3B00;
  --field:#F2F2F2; --hit:#FFF3A6; --on-signal:#000000; --on-color:#FFFFFF;
  --bw:3px; --fs:1; --r:10px;
  --font:"Be Vietnam Pro", Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--font);font-weight:600;font-size:calc(17px * var(--fs));line-height:1.35;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(196px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
body.hc{--bw:4px;--field:var(--paper);--soft:var(--ink)}
body.hc input{font-weight:900}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--bank);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:var(--bw) solid var(--line);
  display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.15em;font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:.8em;color:var(--soft);font-weight:700}
.tbtn{min-height:48px;min-width:48px;padding:0 12px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:.95em}
.tbtn .n{display:inline-block;min-width:1.6em;padding:0 .3em;margin-left:4px;background:var(--ink);color:var(--paper);border-radius:6px}

main{max-width:560px;margin:0 auto;padding:10px 12px 0}
.editing{display:none;margin:0 0 10px;padding:10px 12px;border:var(--bw) dashed var(--bank);border-radius:var(--r);color:var(--bank);font-weight:800;align-items:center;gap:8px}
.editing.on{display:flex}
.editing button{margin-left:auto;min-height:40px;border:2px solid var(--bank);background:var(--paper);color:var(--bank);border-radius:8px;font-weight:800;padding:0 10px}

/* Mặt hàng */
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.item{min-height:56px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:1em;padding:4px}
.item[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

label.f{display:block;font-size:.85em;font-weight:800;margin:0 0 4px}
.f .u{font-weight:600;color:var(--soft)}
.in{width:100%;min-height:56px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--field);padding:6px 12px;font-size:1.35em;font-weight:800;appearance:none}
.in:focus{background:var(--paper)}
.in.big{font-size:1.9em;min-height:66px;letter-spacing:.01em}
.in.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--signal)}100%{background:var(--field)}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.blk{margin-bottom:12px;position:relative}
.hint{font-size:.82em;color:var(--soft);font-weight:700;margin-top:4px;min-height:1.2em}
.hint.warn{color:var(--warn)}

/* Gợi ý biển số */
.sug{position:absolute;left:0;right:0;top:100%;z-index:15;background:var(--paper);border:var(--bw) solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);display:none;max-height:260px;overflow:auto}
.sug.on{display:block}
.sug button{display:flex;width:100%;justify-content:space-between;gap:8px;min-height:52px;padding:6px 12px;border:0;border-bottom:2px solid var(--line);background:var(--paper);text-align:left;font-weight:800;font-size:1.05em}
.sug button:last-child{border-bottom:0}
.sug button span{font-weight:600;color:var(--soft);font-size:.9em}

/* Tạp chất */
.tc{display:grid;grid-template-columns:repeat(4,52px) 1fr;gap:6px;align-items:stretch}
.chip{min-height:56px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:800}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tc .in{font-size:1.25em;min-height:56px;text-align:center;padding:4px}

/* Thanh toán */
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.pay button{min-height:52px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:.95em}
.pay button[data-k="cash"][aria-pressed="true"]{background:var(--cash);border-color:var(--cash);color:var(--on-color)}
.pay button[data-k="ck"][aria-pressed="true"]{background:var(--bank);border-color:var(--bank);color:var(--on-color)}
.pay button[data-k="debt"][aria-pressed="true"]{background:var(--debt);border-color:var(--debt);color:var(--on-color)}

/* Các bước tính */
.steps{border-top:var(--bw) solid var(--line);margin-top:6px;padding:10px 0 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:1em}
.steps dt{font-weight:700;color:var(--soft)}
.steps dd{margin:0;text-align:right;font-weight:900}

/* Dải tổng tiền — giống bảng số cân */
.total{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--signal);color:var(--on-signal);border-top:4px solid var(--line);padding:6px 14px 8px}
.total .in2{max-width:560px;margin:0 auto}
.total .l1{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.95em}
.total .money{font-size:calc(2.55em);font-weight:900;line-height:1.05;letter-spacing:-.02em;text-align:right;white-space:nowrap;overflow:hidden}
.total .money small{font-size:.45em;font-weight:800;margin-left:4px}
.total .words{font-size:.78em;font-weight:700;text-align:right;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Thanh dưới */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);border-top:var(--bw) solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 84px 1fr;gap:10px;align-items:center}
.bar .b{min-height:60px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:900;font-size:1.05em}
.bar .save{background:var(--ink);color:var(--paper)}
.mic{width:76px;height:76px;margin-top:-30px;border-radius:50%;border:4px solid var(--line);background:var(--signal);color:var(--on-signal);display:grid;place-items:center;justify-self:center;box-shadow:0 0 0 4px var(--paper)}
.mic svg{width:34px;height:34px}
.mic svg path{fill:var(--on-signal)}
.mic.on{background:var(--warn);animation:pulse 1s infinite}
.mic.on svg path{fill:var(--on-color)}
@keyframes pulse{0%{box-shadow:0 0 0 4px var(--paper),0 0 0 4px rgba(196,0,26,.6)}100%{box-shadow:0 0 0 4px var(--paper),0 0 0 18px rgba(196,0,26,0)}}
.mic.cont::after{content:"∞";position:absolute;transform:translate(26px,-26px);background:var(--ink);color:var(--paper);border-radius:10px;padding:0 6px;font-size:.8em}

/* Khung giọng nói */
.voice{position:fixed;left:8px;right:8px;bottom:calc(196px + env(safe-area-inset-bottom,0px));z-index:40;max-width:560px;margin:0 auto;
  background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:10px 12px;display:none;max-height:52vh;overflow:auto}
.voice.on{display:block}
.voice .st{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9em}
.voice .st .x{margin-left:auto;min-width:44px;min-height:44px;border:var(--bw) solid var(--line);border-radius:8px;background:var(--paper);font-weight:900}
.voice .heard{font-size:1.3em;font-weight:900;margin:6px 0;min-height:1.4em;word-break:break-word}
.voice .heard.interim{color:var(--soft)}
.voice .ans{font-weight:700;white-space:pre-line;margin:6px 0}
.voice .ans.err{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips span{border:2px solid var(--ink);border-radius:8px;padding:3px 8px;font-weight:800;background:var(--hit)}
.chips span.bad{background:var(--paper);border-color:var(--warn);color:var(--warn)}
.confirm{display:none;gap:8px;margin:8px 0}
.confirm.on{display:grid;grid-template-columns:1fr 1fr}
.confirm button{min-height:54px;border:var(--bw) solid var(--line);border-radius:var(--r);font-weight:900;background:var(--paper)}
.confirm button.yes{background:var(--warn);border-color:var(--warn);color:var(--on-color)}
.cmd{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}
.cmd input{min-height:50px;border:var(--bw) solid var(--line);border-radius:var(--r);padding:4px 10px;font-weight:700;font-size:1em}
.cmd button,.vtools button{min-height:50px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--ink);color:var(--paper);font-weight:800;padding:0 14px}
.vtools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vtools button{background:var(--paper);color:var(--ink);flex:1;min-width:110px}

/* Bảng trượt */
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:var(--bw) solid var(--line);position:sticky;top:0;background:var(--paper)}
.sheet header h2{flex:1;margin:0;font-size:1.25em;font-weight:900}
.sheet .body{flex:1;overflow:auto;padding:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .body>*{max-width:560px;margin-left:auto;margin-right:auto}
.daynav{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;margin-bottom:10px}
.daynav button,.daynav input{min-height:52px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:900;font-size:1.05em;text-align:center}
.filters{display:flex;gap:6px;margin-bottom:10px;overflow:auto}
.filters button{min-height:44px;border:2px solid var(--line);border-radius:22px;background:var(--paper);font-weight:800;padding:0 14px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rec{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;background:var(--paper);width:100%;text-align:left}
.rec.sel{background:var(--hit)}
.rec .no{grid-row:span 3;font-size:1.4em;font-weight:900;align-self:center;text-align:center}
.rec .a{font-weight:900;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .b{font-weight:700;color:var(--soft)}
.rec .m{font-weight:900;font-size:1.2em;text-align:right;white-space:nowrap}
.rec .nt{justify-self:end;align-self:start;font-size:.8em;font-weight:900;padding:2px 8px;border-radius:6px;color:var(--on-color);background:var(--soft)}
.rec .nt.cash{background:var(--cash)} .rec .nt.ck{background:var(--bank)} .rec .nt.debt{background:var(--debt)}
.rec .del{grid-column:3;justify-self:end;min-height:40px;min-width:44px;border:2px solid var(--warn);color:var(--warn);background:var(--paper);border-radius:8px;font-weight:900}
.sum{border:4px solid var(--ink);border-radius:var(--r);background:var(--signal);color:var(--on-signal);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-weight:800;margin-top:6px}
.sum b{font-weight:900;text-align:right}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns button,.wbtn{min-height:52px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:800}
.wbtn{width:100%;margin-top:8px}
.wbtn.dark{background:var(--ink);color:var(--paper)}
.wbtn.danger{border-color:var(--warn);color:var(--warn)}
.empty{border:var(--bw) dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;font-weight:700}

/* Cài đặt */
.set h3{font-size:1.05em;font-weight:900;margin:18px 0 8px;padding-bottom:4px;border-bottom:var(--bw) solid var(--line)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:2px solid var(--line);font-weight:800}
.tg input{width:30px;height:30px;accent-color:var(--ink)}
.tg span{flex:1}
.cust{border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.cust b{font-size:1.05em;font-weight:900}
.cust .p{grid-column:1;font-weight:700;color:var(--soft);font-size:.9em}
.cust button{grid-row:1/span 3;grid-column:2;min-height:48px;min-width:64px;border:var(--bw) solid var(--line);border-radius:8px;background:var(--paper);font-weight:800;align-self:center}
textarea.in{min-height:110px;font-size:1.1em;font-weight:700;font-family:var(--font)}
.help h3{font-size:1.05em;font-weight:900;margin:16px 0 6px}
.help button{display:block;width:100%;text-align:left;min-height:48px;border:0;border-bottom:2px solid var(--line);background:var(--paper);padding:8px 2px;font-weight:800}
.help button span{display:block;font-weight:600;color:var(--soft);font-size:.9em}
.help p{font-weight:600}
.toast{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font-weight:800;padding:12px 18px;border-radius:12px;max-width:92vw;display:none;text-align:center}
.toast.on{display:block}
.toast.err{background:var(--warn)}

/* ---- Bảng màu ---- */
body[data-theme="diu"]{--paper:#F1ECE1;--ink:#2B2721;--soft:#5C544A;--line:#3B352D;--signal:#E3C77E;--on-signal:#2B2721;--field:#E6DFD0;--hit:#EEDFB0;
  --warn:#A8322D;--cash:#3F6B45;--bank:#34557F;--debt:#8A5A2B;--on-color:#FBF8F2}
body[data-theme="xam"]{--paper:#E3E6E9;--ink:#1F2327;--soft:#4B5159;--line:#343A40;--signal:#B7CCDC;--on-signal:#1F2327;--field:#D3D8DD;--hit:#CADBE8;
  --warn:#A33A36;--cash:#3E6B4F;--bank:#2F5275;--debt:#85572F;--on-color:#F4F6F8}
body[data-theme="la"]{--paper:#E5ECE1;--ink:#1F2A20;--soft:#4A5A4B;--line:#2F3D30;--signal:#BFD6AE;--on-signal:#1F2A20;--field:#D5E0CF;--hit:#D3E5C3;
  --warn:#A3372F;--cash:#35683F;--bank:#2F5470;--debt:#83562A;--on-color:#F3F7F1}
body[data-theme="toi"]{--paper:#1C1E21;--ink:#E9E5DD;--soft:#B3AEA5;--line:#7A7E84;--signal:#C9A646;--on-signal:#15161A;--field:#282B2F;--hit:#3B3522;
  --warn:#E07A6F;--cash:#6DB07E;--bank:#7FA6D6;--debt:#D9A066;--on-color:#15161A}
body[data-theme="toi"] .in.flash{animation:flashd 1.2s ease-out}
@keyframes flashd{0%{background:#5A4B1E}100%{background:var(--field)}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;min-height:60px;padding:6px 10px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);text-align:left;font-weight:800}
.theme[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.theme i{display:block;width:40px;height:40px;border-radius:8px;border:2px solid #555;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
.theme small{display:block;font-weight:600;color:var(--soft);font-size:.8em}
select.in{font-size:1em;font-weight:700}
.vwarn{border:var(--bw) solid var(--warn);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-weight:700;margin-top:8px;white-space:pre-line}
.vok{border:var(--bw) solid var(--cash);color:var(--cash);border-radius:var(--r);padding:10px 12px;font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><b>Cân nhanh</b><small id="todayLbl"></small></div>
  <button class="tbtn" id="btnList" aria-label="Danh sách phiếu hôm nay">Hôm nay<span class="n" id="cnt">0</span></button>
  <button class="tbtn" id="btnSet" aria-label="Cài đặt">⚙︎</button>
</div>

<main>
  <div class="editing" id="editing">Đang sửa phiếu <span id="editNo"></span><button id="btnCancelEdit">Thôi sửa</button></div>

  <div class="items" id="items" role="group" aria-label="Mặt hàng"></div>

  <div class="blk">
    <label class="f" for="plate">Biển số</label>
    <input class="in" id="plate" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Gõ vài số, VD 784">
    <div class="sug" id="sug"></div>
  </div>
  <div class="blk">
    <label class="f" for="name">Khách hàng <span class="u">(gõ mã KH cũng được)</span></label>
    <input class="in" id="name" autocomplete="off" placeholder="Tên hoặc mã khách">
  </div>

  <div class="row">
    <div>
      <label class="f" for="gross">KL xe hàng <span class="u">(vô)</span></label>
      <input class="in big" id="gross" inputmode="numeric" autocomplete="off" placeholder="0">
    </div>
    <div>
      <label class="f" for="tare">KL xe <span class="u">(ra)</span></label>
      <input class="in big" id="tare" inputmode="numeric" autocomplete="off" placeholder="0">
    </div>
  </div>
  <div class="hint" id="wHint" style="margin:-6px 0 10px"></div>

  <div class="blk">
    <label class="f">Tạp chất <span class="u">(% · kg trừ thêm)</span></label>
    <div class="tc">
      <button class="chip" data-tc="0">0</button>
      <button class="chip" data-tc="1">1%</button>
      <button class="chip" data-tc="2">2%</button>
      <button class="chip" data-tc="3">3%</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <input class="in" id="tcPct" inputmode="decimal" placeholder="%" aria-label="Tạp chất phần trăm">
        <input class="in" id="tcKg" inputmode="numeric" placeholder="+kg" aria-label="Tạp chất thêm kg">
      </div>
    </div>
  </div>

  <div class="blk">
    <label class="f" for="price">Đơn giá <span class="u">(đ/kg)</span></label>
    <input class="in big" id="price" inputmode="numeric" autocomplete="off" placeholder="0">
    <div class="hint" id="pHint"></div>
  </div>

  <div class="blk">
    <label class="f">Thanh toán</label>
    <div class="pay" id="pay">
      <button data-k="cash">Tiền mặt</button>
      <button data-k="ck">Chuyển khoản</button>
      <button data-k="debt">Chưa trả</button>
    </div>
    <input class="in" id="note" style="font-size:1.05em" placeholder="Ghi chú thêm">
  </div>

  <dl class="steps" id="steps"></dl>
</main>

<div class="total" aria-live="polite">
  <div class="in2">
    <div class="l1"><span id="tItem">—</span><span id="tCalc"></span></div>
    <div class="money" id="tMoney">0<small>đ</small></div>
    <div class="words" id="tWords"></div>
  </div>
</div>

<div class="bar">
  <button class="b" id="btnClear">Làm lại</button>
  <button class="mic" id="btnMic" aria-label="Nói lệnh">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59A6 6 0 0 0 18 11.5Z"/></svg>
  </button>
  <button class="b save" id="btnSave">Lưu phiếu</button>
</div>

<section class="voice" id="voice" aria-live="polite">

<script>
/* ===== BỘ HIỂU CÂU TIẾNG VIỆT (thuần logic) ===== */
const strip = s => [...String(s)].map(c => (c === 'đ' || c === 'Đ') ? 'd' : c.normalize('NFD').replace(/[\u0300-\u036f]/g, '')).join('').toLowerCase();

const DW = {'không':0,'một':1,'mốt':1,'hai':2,'ba':3,'bốn':4,'tư':4,'năm':5,'lăm':5,'nhăm':5,'sáu':6,'bảy':7,'bẩy':7,'tám':8,'chín':9};
const DW_STRONG = new Set(['một','hai','ba','bốn','năm','sáu','bảy','bẩy','tám','chín']);
const SW = {'khong':0,'mot':1,'hai':2,'ba':3,'bon':4,'tu':4,'nam':5,'lam':5,'sau':6,'bay':7,'tam':8,'chin':9};
const SW_STRONG = new Set(['hai','ba','bon','mot','chin']);
const NAME_PREFIX = new Set(['anh','chi','co','chu','bac','ong','em','a','c','thim','di','cau','mo','ba','o','dung','ut','u','cau']);
const UNITS = new Set(['ky','ki','kg','kilo','kilogam','kgs']);
const NUMERAL = /^\d+(?:[.,]\d+)*(?:k\d*)?$/i;

function parseNumeral(raw) {
  let s = raw.toLowerCase();
  const km = s.match(/^([\d.,]+)k(\d*)$/);
  if (km) {
    const base = parseNumeral(km[1]).v * 1000;
    const tail = km[2] ? parseInt(km[2].padEnd(3, '0').slice(0, 3), 10) : 0;
    return { v: base + tail, len: 4 };
  }
  if (/^\d{1,3}(?:[.,]\d{3})+$/.test(s)) { const v = parseInt(s.replace(/[.,]/g, ''), 10); return { v, len: String(v).length }; }
  if (/[.,]/.test(s)) { const v = parseFloat(s.replace(',', '.')); return { v, len: 2, dec: true }; }
  return { v: parseInt(s, 10), len: s.length };
}

function numInfo(w) {
  if (w == null) return null;
  if (NUMERAL.test(w)) { const p = parseNumeral(w); return { t: 'd', v: p.v, len: p.len, num: true, strong: true, raw: w }; }
  if (w in DW) return { t: 'd', v: DW[w], len: 1, strong: DW_STRONG.has(w) };
  switch (w) {
    case 'mười': return { t: 'ten', strong: true };
    case 'mươi': case 'chục': return { t: 'm', v: 10 };
    case 'trăm': return { t: 'm', v: 100 };
    case 'nghìn': case 'ngàn': case 'ngìn': case 'k': case 'ka': case 'tấn': return { t: 'm', v: 1000 };
    case 'triệu': return { t: 'm', v: 1e6 };
    case 'linh': case 'lẻ': return { t: 'linh' };
    case 'rưỡi': case 'rưởi': return { t: 'half' };
    case 'chấm': case 'phẩy': case 'phết': return { t: 'dot' };
  }
  const s = strip(w);
  if (s in SW) return { t: 'd', v: SW[s], len: 1, strong: SW_STRONG.has(s) };
  switch (s) {
    case 'muoi': return { t: 'ambig' };
    case 'chuc': return { t: 'm', v: 10 };
    case 'tram': return { t: 'm', v: 100 };
    case 'nghin': case 'ngan': return { t: 'm', v: 1000 };
    case 'tan': return { t: 'mw', v: 1000 };
    case 'trieu': return { t: 'm', v: 1e6 };
    case 'linh': case 'le': return { t: 'linh' };
    case 'ruoi': return { t: 'half' };
    case 'cham': case 'phay': return { t: 'dot' };
  }
  return null;
}

function tens(ts) {
  let a = ts.slice();
  if (a.length && a[0].t === 'linh') a = a.slice(1);
  if (!a.length) return { v: 0 };
  const [x, y, z] = a;
  if (a.length === 1) { if (x.t === 'ten') return { v: 10 }; if (x.t === 'd') return { v: x.v }; if (x.t === 'half') return { v: 5 }; }
  if (x.t === 'ten') { if (y && y.t === 'd') return { v: 10 + y.v }; return { v: 10 }; }
  if (x.t === 'd' && y && y.t === 'm' && y.v === 10) { return { v: x.v * 10 + (z && z.t === 'd' ? z.v : 0) }; }
  if (a.length === 2 && x.t === 'd' && y && y.t === 'd' && !x.num && !y.num) return { v: x.v * 10 + y.v, colloq: true };
  if (x.t === 'd' && y && y.t === 'half') return { v: x.v + 0.5 };
  let v = 0; for (const t of a) if (t.t === 'd') v = v * 10 + t.v; return { v };
}

function small(ts) {
  const hi = ts.findIndex(t => t.t === 'm' && t.v === 100);
  if (hi < 0) return tens(ts);
  const before = ts.slice(0, hi), rest = ts.slice(hi + 1);
  const h = before.length ? tens(before).v : 1;
  let r = 0;
  if (!rest.length) r = 0;
  else if (rest.length === 1 && rest[0].t === 'half') r = 50;
  else if (rest.length === 1 && rest[0].t === 'd' && rest[0].len === 1) r = rest[0].v * 10;
  else r = tens(rest).v;
  return { v: h * 100 + r };
}

function evalInt(ts) {
  let total = 0, buf = [], lastBig = 0, colloq = false;
  for (const x of ts) {
    if (x.t === 'm' && x.v >= 1000) {
      total += (buf.length ? small(buf).v : 1) * x.v; lastBig = x.v; buf = [];
    } else buf.push(x);
  }
  if (buf.length) {
    if (!lastBig) { const r = small(buf); total += r.v; colloq = !!r.colloq; }
    else {
      const hasHundred = buf.some(t => t.t === 'm' && t.v === 100);
      if (buf.length === 1 && buf[0].t === 'half') total += lastBig / 2;
      else if (!hasHundred && buf[0].t === 'd' && buf[0].len === 1) {
        const rest = buf.slice(1);
        total += buf[0].v * lastBig / 10;
        if (rest.length === 1 && rest[0].t === 'half') total += lastBig / 20;
        else if (rest.length) total += tens(rest).v * lastBig / 1000;
      } else total += small(buf).v * lastBig / 1000;
    }
  }
  return { v: total, colloq };
}

function evalRun(run) {
  const di = run.findIndex(x => x.t === 'dot');
  if (di < 0) return evalInt(run);
  let intPart = run.slice(0, di), after = run.slice(di + 1), mult = 1;
  if (after.length && after[after.length - 1].t === 'm' && after[after.length - 1].v >= 1000) { mult = after[after.length - 1].v; after = after.slice(0, -1); }
  const frac = after.filter(x => x.t === 'd').map(x => x.num ? String(x.raw).replace(/\D/g, '') : String(x.v)).join('');
  const iv = evalInt(intPart).v;
  return { v: parseFloat(iv + '.' + (frac || '0')) * mult };
}

/* Tách câu thành từ + số */
function tokenize(text) {
  let t = String(text).normalize('NFC').toLowerCase();
  t = t.replace(/phần trăm|phan tram/g, ' % ').replace(/%/g, ' % ');
  t = t.replace(/[;!?\n]/g, ' , ').replace(/,(?!\d)|(?<!\d),/g, ' , ').replace(/\.(?!\d)|(?<!\d)\./g, ' ');
  t = t.replace(/[-–—:"“”()]/g, ' ').replace(/(\d)\s+k(?![\p{L}\d])/gu, '$1k');
  const words = t.split(/\s+/).filter(Boolean);
  const out = [];
  let i = 0;
  while (i < words.length) {
    const w = words[i];
    if (w === ',') { out.push({ k: 'sep' }); i++; continue; }
    if (w === '%') { const last = out[out.length - 1]; if (last && last.k === 'num') last.pct = true; i++; continue; }
    const info = numInfo(w);
    const prev = out.length ? out[out.length - 1] : null;
    const prevS = prev && prev.k === 'w' ? prev.s : '';
    const canStart = info && ((info.t === 'd' && info.strong) || info.t === 'ten') && !(NAME_PREFIX.has(prevS) && !info.num);
    if (canStart) {
      const run = [info.t === 'ambig' ? { t: 'ten' } : info];
      let j = i + 1, cham = false, afterDot = false;
      while (j < words.length) {
        let nx = numInfo(words[j]);
        if (!nx) break;
        const last = run[run.length - 1];
        if (nx.t === 'ambig') nx = last.t === 'd' ? { t: 'm', v: 10 } : { t: 'ten' };
        if (nx.t === 'mw') { if (last.t === 'd') nx = { t: 'm', v: 1000 }; else break; }
        if (nx.t === 'dot') {
          const nn = numInfo(words[j + 1]);
          if (nn && nn.t === 'd' && !afterDot) { run.push(nx); afterDot = true; j++; continue; }
          cham = true; j++; break;
        }
        if (nx.t === 'linh') { const nn = numInfo(words[j + 1]); if (nn && nn.t === 'd') { run.push(nx); j++; continue; } break; }
        if (nx.t === 'd') {
          if (nx.num && last.t === 'd' && last.num) break;
          // Đọc từng chữ số liên tiếp (biển số, cân nặng…) không có "trăm/nghìn" xen giữa —
          // cho phép nối dài tuỳ ý, kể cả có số 0, thay vì bị cắt sau 2 chữ số.
          const pureDigits = run.every(r => r.t === 'd');
          if (nx.v === 0 && !nx.num && !pureDigits) { const nn = numInfo(words[j + 1]); if (!(nn && nn.t === 'm' && nn.v === 100)) break; }
          if (!afterDot && !pureDigits && last.t === 'd' && run.length >= 2 && run[run.length - 2].t === 'd') break;
          if (!afterDot && last.t === 'd' && last.num && !nx.num) {
            // "3 ngàn 2" ok (có hệ số ở giữa) — còn "3200 hai" thì tách
            break;
          }
        }
        if (nx.t === 'm' && last.t === 'm' && last.v === nx.v) break;
        if (nx.t === 'ten' && last.t === 'd' && !run.some(r => r.t === 'm')) break;
        run.push(nx); j++;
      }
      const r = evalRun(run);
      const tok = { k: 'num', v: r.v, colloq: !!r.colloq, cham, raw: words.slice(i, j).join(' ') };
      const allDigitWords = run.every(x => x.t === 'd');
      tok.spoken = allDigitWords && run.length > 1 && !run.some(x => x.num);
      tok.digits = allDigitWords ? run.map(x => x.num ? String(x.raw).replace(/\D/g, '') : String(x.v)).join('') : String(Math.round(r.v));
      if (words[j] === '%') { tok.pct = true; j++; }
      out.push(tok); i = j; continue;
    }
    const s = strip(w);
    if (UNITS.has(s)) { out.push({ k: 'unit' }); i++; if (words[i] && strip(words[i]) === 'lo') i++; continue; }
    out.push({ k: 'w', raw: w, s });
    i++;
  }
  return out;
}

function canonOf(tokens) {
  return tokens.map(t => {
    if (t.k === 'w') return t.s;
    if (t.k === 'sep') return ',';
    if (t.k === 'unit') return 'ky';
    if (t.k === 'num') {
      let v = t.spoken ? t.digits : String(Math.round(t.v * 1000) / 1000);
      return v + (t.pct ? '%' : '');
    }
    return '';
  }).join(' ').replace(/\s+/g, ' ').trim();
}

/* ===== TỪ KHÓA ===== */
const KW = [
  // mặt hàng
  ['sat dac', 'item', 'satdac'], ['dac', 'item', 'satdac'], ['sat vun', 'item', 'sat'], ['sat', 'item', 'sat'],
  ['tole', 'item', 'tole'], ['tol', 'item', 'tole'], ['ton', 'item', 'tole', ['tồn', 'tốn', 'tôn trọng']], ['ton tam', 'item', 'tole'],
  ['vo lon', 'item', 'lon'], ['lon nhom', 'item', 'lon'], ['lon bia', 'item', 'lon'], ['lon', 'item', 'lon', ['lớn']], ['nhom', 'item', 'lon'],
  ['mat hang', 'noop'], ['loai', 'noop'],
  // biển số
  ['bien so xe', 'plate'], ['bien so', 'plate'], ['so xe', 'plate'], ['bien', 'plate'], ['xe so', 'plate'], ['xe', 'plateXe'],
  // khối lượng
  ['khoi luong xe hang', 'gross'], ['kl xe hang', 'gross'], ['xe hang', 'gross'], ['xe vo', 'gross'], ['xe vao', 'gross'], ['can vo', 'gross'], ['can vao', 'gross'],
  ['tong can', 'gross'], ['can tong', 'gross'], ['xe day', 'gross'], ['vo', 'gross'], ['vao', 'gross'], ['luc vo', 'gross'],
  ['khoi luong xe', 'tare'], ['kl xe', 'tare'], ['xe ra', 'tare'], ['can ra', 'tare'], ['xe khong', 'tare'], ['xe rong', 'tare'], ['xac xe', 'tare'],
  ['tru bi', 'tare'], ['bi', 'tare'], ['ra', 'tare'], ['luc ra', 'tare'],
  ['khoi luong hang', 'net'], ['kl hang', 'net'], ['hang', 'net'], ['can le', 'netLe'], ['hang le', 'netLe'], ['mua le', 'netLe'],
  // tạp chất
  ['khong tap chat', 'noTc'], ['bo tap chat', 'noTc'], ['khong tru', 'noTc'], ['tap chat bang khong', 'noTc'],
  ['tap chat them', 'tcKg'], ['tc them', 'tcKg'], ['tap chat roi', 'tcKg'], ['tru them', 'tcKg'], ['cong them', 'tcKg'], ['tru', 'tcKg'], ['cong', 'tcKg'], ['them', 'tcKg'], ['bot', 'tcKg'],
  ['tru tap chat', 'tc'], ['tap chat', 'tc'], ['tap', 'tc'], ['tc', 'tc'],
  // giá
  ['gia hien tai', 'priceNow'], ['gia chuan', 'priceNow'], ['gia mac dinh', 'priceNow'], ['gia cu', 'priceNow'], ['gia goc', 'priceNow'],
  ['tang gia', 'priceUp'], ['cong gia', 'priceUp'], ['them gia', 'priceUp'], ['nang gia', 'priceUp'], ['bu gia', 'priceUp'], ['tro gia', 'priceUp'],
  ['giam gia', 'priceDown'], ['tru gia', 'priceDown'], ['bot gia', 'priceDown'], ['ha gia', 'priceDown'],
  ['don gia', 'price'], ['gia la', 'price'], ['gia', 'price'],
  // khách
  ['khach vang lai', 'nameLe'], ['khach le', 'nameLe'], ['khach hang', 'name'], ['ten khach', 'name'], ['khach', 'name'], ['ten', 'name'], ['chu xe', 'name'], ['cua', 'name'],
  // thanh toán
  ['tien mat', 'note', 'cash'], ['tra tien mat', 'note', 'cash'], ['da tra', 'note', 'cash'], ['tra roi', 'note', 'cash'], ['tra lien', 'note', 'cash'],
  ['chuyen khoan', 'note', 'ck'], ['da chuyen', 'note', 'ck'], ['ck', 'note', 'ck'], ['chuyen', 'note', 'ck'], ['bank', 'note', 'ck'],
  ['chua tra', 'note', 'debt'], ['chua thanh toan', 'note', 'debt'], ['ghi no', 'note', 'debt'], ['no', 'note', 'debt'], ['thieu', 'note', 'debt'], ['tra sau', 'note', 'debt'],
  ['ghi chu', 'noteFree'],
  // hành động
  ['luu va tao moi', 'save'], ['luu phieu', 'save'], ['luu lai', 'save'], ['chot phieu', 'save'], ['luu', 'save'], ['xong', 'save'], ['ghi so', 'save'],
  ['tao dong moi', 'new'], ['tao moi', 'new'], ['phieu moi', 'new'], ['xe moi', 'new'], ['xe khac', 'new'], ['lam moi', 'new'],
  ['xoa form', 'new'], ['lam lai', 'new'], ['xoa het', 'new'], ['xoa trang', 'new'],
];
KW.forEach(k => { k.words = k[0].split(' '); });
KW.sort((a, b) => b.words.length - a.words.length);
const NAMEOK = new Set(['dac', 'ton', 'bi', 'no', 'cong', 'hang', 'them', 'tru', 'bien', 'tro', 'cua', 'loai', 'tap', 'bot', 'ra', 'vo', 'vao', 'thieu', 'ten', 'chuyen']);

function kwAt(tokens, i) {
  for (const k of KW) {
    const n = k.words.length;
    let ok = true;
    for (let a = 0; a < n; a++) {
      const t = tokens[i + a];
      if (!t || t.k !== 'w' || t.s !== k.words[a]) { ok = false; break; }
    }
    if (!ok) continue;
    if (k[3]) { const rawSeq = tokens.slice(i, i + n + 1).map(t => t.raw || '').join(' '); if (k[3].some(bad => rawSeq.startsWith(bad) || tokens[i].raw === bad)) continue; }
    return k;
  }
  return null;
}

function markKeywords(tokens) {
  const out = [];
  let i = 0;
  while (i < tokens.length) {
    const t = tokens[i];
    if (t.k !== 'w') { out.push(t); i++; continue; }
    const k = kwAt(tokens, i);
    if (!k) { out.push(t); i++; continue; }
    const n = k.words.length, type = k[1];
    let j = i + n;
    if (type === 'plate' || type === 'plateXe') {
      let col = '';
      while (j < tokens.length) {
        const x = tokens[j];
        if (x.k === 'num') {
          const add = x.digits || String(Math.round(x.v));
          if (col && !/[a-z]/i.test(col) && add.length > 3) break;
          if ((col + add).length > 10) break;

    </div>`).join('') : `<div class="empty">${all.length ? 'Không có phiếu khớp bộ lọc.' : 'Chưa có phiếu nào ngày ' + dmy(viewDate) + '. Nhập số rồi bấm Lưu phiếu.'}</div>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function stats(rs) {
  const o = { n: rs.length, net: 0, money: 0, debt: 0, cash: 0, ck: 0, tc: 0, goods: 0, cust: new Set() };
  rs.forEach(r => { o.net += r.net || 0; o.money += r.money || 0; o.tc += r.tc || 0; o.goods += (r.gross - r.tare) || 0; if (r.noteKind === 'cash') o.cash += r.money; else if (r.noteKind === 'ck') o.ck += r.money; else o.debt += r.money; o.cust.add(r.plate || r.name); });
  return o;
}
function copyText(rs, d) {

  return `PHIẾU CÂN ${dmy(d)}\n` + rs.map((r, i) => `${i + 1}. ${r.plate || ''} ${r.name || ''} | ${ITEM_NAME[r.item]} ${fmt(r.net)}kg x ${fmt(r.price)} = ${fmt(r.money)}${noteText(r) ? ' | ' + noteText(r) : ''}`).join('\n') +
    `\nTỔNG: ${fmt(st.net)} kg · ${fmt(st.money)} đ · Chưa trả ${fmt(st.debt)} đ`;

async function copyDay(d) {

  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); say('Đã copy ' + rs.length + ' phiếu.'); } catch (_) { say('Máy không cho copy tự động.', null, true); } ta.remove(); }
}

/* ---- báo cáo bằng câu hỏi ---- */
function rangeOf(c) {
  const t = today(), d = new Date(t + 'T12:00:00');
  if (/\bhom nay\b|\bnay\b.*\bbao nhieu\b/.test(c) && !/\b(tuan|thang)\b/.test(c)) return { from: t, to: t, lbl: 'hôm nay' };
  if (/\bhom qua\b/.test(c)) return { from: addDays(t, -1), to: addDays(t, -1), lbl: 'hôm qua' };
  if (/\bhom kia\b/.test(c)) return { from: addDays(t, -2), to: addDays(t, -2), lbl: 'hôm kia' };
  if (/\btuan truoc\b/.test(c)) { const w = (d.getDay() + 6) % 7; return { from: addDays(t, -w - 7), to: addDays(t, -w - 1), lbl: 'tuần trước' }; }
  if (/\btuan (nay|nay)\b|\bmay ngay nay\b/.test(c)) { const w = (d.getDay() + 6) % 7; return { from: addDays(t, -w), to: t, lbl: 'tuần này' }; }
  if (/\bthang truoc\b/.test(c)) { const a = new Date(d.getFullYear(), d.getMonth() - 1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); return { from: today(a), to: today(b), lbl: 'tháng trước' }; }
  if (/\bthang (nay|nay)\b/.test(c)) return { from: t.slice(0, 8) + '01', to: t, lbl: 'tháng này' };
  const m = c.match(/\bngay (\d{1,2})(?: thang (\d{1,2}))?\b/);
  if (m) { const ds = d.getFullYear() + '-' + String(m[2] || d.getMonth() + 1).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0'); return { from: ds, to: ds, lbl: 'ngày ' + dmy(ds).slice(0, 5) }; }
  if (/\b(tat ca|tu truoc|toi gio|tong cong tat)\b/.test(c)) return { from: '0000', to: '9999', lbl: 'từ trước tới giờ' };
  return null;
}
function itemIn(tokens) { for (const t of tokens) if (t.k === 'kw' && t.type === 'item') return t.arg; return null; }
function custIn(c) {
  const names = new Map();
  S.customers.forEach(x => names.set(x.name, x)); S.records.forEach(r => r.name && !names.has(r.name) && names.set(r.name, null));
  let best = null;
  for (const name of names.keys()) {
    const full = strip(name).trim();
    const core = full.split(' ').filter(w => !NAME_PREFIX.has(w)).join(' ');
    for (const key of [full, core]) if (key && key.length >= 2 && new RegExp('(^| )' + key.replace(/[.*+?^${}()|[\]\\]/g, '') + '( |$)').test(c) && (!best || key.length > best.k.length)) best = { name, k: key };
  }
  return best ? best.name : null;
}
function report(c, tokens) {
  const isDebt = /\b(con no|cong no|chua tra|no bao nhieu|no may|thieu bao nhieu|ai no|khach nao no)\b/.test(c);
  let rg = rangeOf(c) || (isDebt ? { from: '0000', to: '9999', lbl: 'tới giờ' } : { from: today(), to: today(), lbl: 'hôm nay' });
  let rs = S.records.filter(r => r.date >= rg.from && r.date <= rg.to);
  const item = itemIn(tokens), cust = custIn(c);
  const pm = c.match(/\bxe (\d{3,}[a-z0-9]*)/);
  let who = '';
  if (item) rs = rs.filter(r => r.item === item);
  if (cust) { rs = rs.filter(r => r.name === cust); who = ' ' + cust; }
  else if (pm) { const q = pm[1].toUpperCase(); rs = rs.filter(r => normPlate(r.plate).includes(q) || digitsOf(r.plate).includes(digitsOf(q))); who = ' xe ' + q; }
  const st = stats(rs), itemL = item ? ' ' + ITEM_NAME[item] : '', L = (who ? who.trim() + ', ' : '') + rg.lbl + itemL;

  if (/\bso voi\b/.test(c)) {
    const a = stats(recsOf(today())), b = stats(recsOf(addDays(today(), -1)));
    const diff = a.net - b.net;
    return [`Hôm nay ${fmt(a.net)} kg · ${fmt(a.money)} đ (${a.n} phiếu)\nHôm qua ${fmt(b.net)} kg · ${fmt(b.money)} đ (${b.n} phiếu)\n${diff >= 0 ? 'Hơn' : 'Kém'} ${fmt(Math.abs(diff))} kg`,
      `Hôm nay ${readNum(a.net)} ký, hôm qua ${readNum(b.net)} ký, ${diff >= 0 ? 'hơn' : 'kém'} ${readNum(Math.abs(diff))} ký`];
  }
  if (isDebt) {
    const debt = rs.filter(r => !r.noteKind || r.noteKind === 'debt');
    if (!debt.length) return ['Không còn nợ ai' + (who ? who : '') + ' (' + rg.lbl + ').', 'Không còn nợ ai'];
    const by = {}; debt.forEach(r => { const k = r.name || r.plate || 'Không tên'; by[k] = (by[k] || 0) + r.money; });
    const list = Object.entries(by).sort((a, b) => b[1] - a[1]);
    const tot = list.reduce((s, x) => s + x[1], 0);
    return ['Còn nợ ' + fmt(tot) + ' đ (' + L + ')\n' + list.map(([k, v]) => '• ' + k + ': ' + fmt(v) + ' đ').join('\n'),
      (who ? cap(who.trim()) + ' còn nợ ' : 'Tổng còn nợ ') + readNum(tot) + ' đồng' + (!who && list.length > 1 ? ', ' + list.length + ' khách' : '')];
  }
  if (!rs.length) return ['Không có phiếu nào (' + L + ').', 'Không có phiếu nào ' + L];
  if (/\btien mat\b/.test(c)) return ['Tiền mặt đã trả ' + L + ': ' + fmt(st.cash) + ' đ', 'Tiền mặt ' + readNum(st.cash) + ' đồng'];
  if (/\b(chuyen khoan|ck)\b/.test(c)) return ['Đã chuyển khoản ' + L + ': ' + fmt(st.ck) + ' đ', 'Chuyển khoản ' + readNum(st.ck) + ' đồng'];
  if (/\btap chat\b/.test(c)) { const pc = st.goods ? st.tc / st.goods * 100 : 0; return [`Tạp chất ${L}: ${fmt(st.tc)} kg (${fmt(Math.round(pc * 100) / 100)}% KL hàng)`, 'Tạp chất ' + readNum(st.tc) + ' ký, ' + readDec(pc) + ' phần trăm']; }
  if (/\btrung binh\b/.test(c)) { const avg = st.net ? Math.round(st.money / st.net) : 0; return [`Giá bình quân${itemL} ${rg.lbl}: ${fmt(avg)} đ/kg`, 'Giá bình quân ' + readNum(avg) + ' đồng một ký']; }
  if (/\b(khach nao|ai)\b.*\b(nhieu nhat|lon nhat|dong nhat)\b/.test(c)) {
    const by = {}; rs.forEach(r => { const k = r.name || r.plate || 'Không tên'; by[k] = (by[k] || 0) + r.net; });
    const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 3);
    return ['Bán nhiều nhất ' + L + ':\n' + top.map(([k, v], i) => (i + 1) + '. ' + k + ': ' + fmt(v) + ' kg').join('\n'), top[0][0] + ' nhiều nhất, ' + readNum(top[0][1]) + ' ký'];
  }
  if (/\b(phieu|xe|chuyen)\b.*\b(lon nhat|nang nhat|nhieu tien nhat|to nhat)\b/.test(c)) {
    const r = rs.reduce((a, b) => (b.money > a.money ? b : a));
    return [`Phiếu lớn nhất ${L}: ${r.plate || ''} ${r.name || ''} · ${ITEM_NAME[r.item]} ${fmt(r.net)} kg · ${fmt(r.money)} đ`, 'Phiếu lớn nhất ' + readNum(r.money) + ' đồng, của ' + (r.name || 'xe ' + r.plate)];
  }
  if (/\b(may|bao nhieu) (xe|phieu|chuyen|luot)\b|\b(xe|phieu|chuyen) bao nhieu\b|\bmay chuyen\b/.test(c)) return [`${cap(L)}: ${st.n} phiếu`, cap(L.trim()) + ' ' + readNum(st.n) + ' phiếu'];
  if (/\b(may|bao nhieu) (khach|nguoi)\b/.test(c)) return [`${cap(L)}: ${st.cust.size} khách`, readNum(st.cust.size) + ' khách'];
  if (/\b(tan|ky|kg|ki|khoi luong|kl|bao nhieu hang)\b/.test(c)) {
    const tan = /\btan\b/.test(c);
    return [`KL thực ${L}: ${fmt(st.net)} kg (≈ ${fmt(Math.round(st.net / 100) / 10)} tấn) · ${st.n} phiếu · ${fmt(st.money)} đ`, tan ? readDec(Math.round(st.net / 100) / 10) + ' tấn' : readNum(st.net) + ' ký'];
  }
  return [`Tiền mua hàng ${L}: ${fmt(st.money)} đ\n${st.n} phiếu · ${fmt(st.net)} kg · chưa trả ${fmt(st.debt)} đ`, 'Tổng ' + readNum(st.money) + ' đồng'];
}

/* ---- xử lý câu lệnh ---- */
function rowRef(c) {
  const m = c.match(/\b(?:dong|phieu) (\d+|cuoi(?: cung)?|vua roi|vua xong|truoc)\b/) || c.match(/\b(phieu vua roi|phieu cuoi|phieu truoc)\b/);
  if (!m) return null;
  const list = recsOf(viewDate);
  const key = m[1];
  if (/^\d+$/.test(key)) { const r = list[+key - 1]; return r ? { r, n: +key } : { miss: +key }; }
  const r = list[list.length - 1] || [...S.records].pop();
  return r ? { r, n: recsOf(r.date).indexOf(r) + 1 } : { miss: 'cuối' };
}
function tokensAfterRow(tokens) {
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.k === 'w' && /^(dong|phieu)$/.test(t.s)) { const n = tokens[i + 1]; if (n && (n.k === 'num' || (n.k === 'w' && /^(cuoi|vua)$/.test(n.s)))) { let j = i + 2; while (tokens[j] && tokens[j].k === 'w' && /^(cung|roi|xong|doi|thanh|sang|la|thanh)$/.test(tokens[j].s)) j++; return tokens.slice(j); } }
  }
  return [];
}
function describe(r, n) { return `Dòng ${n}: ${r.plate || ''} ${r.name || ''} · ${ITEM_NAME[r.item]} ${fmt(r.gross)} − ${fmt(r.tare)}, TC ${fmt(r.tc)} → ${fmt(r.net)} kg × ${fmt(r.price)} = ${fmt(r.money)} đ${noteText(r) ? ' · ' + noteText(r) : ''}`; }
function pushUndo() { undoStack.push(JSON.stringify(S.form)); if (undoStack.length > 30) undoStack.shift(); }
function setPrice(item, v) { S.prices[item] = v; renderPrices(); if (S.form.item === item && S.form.priceAuto) { autoPrice(S.form); renderForm(['price']); } persist(); }

function handle(text) {
  text = String(text || '').trim(); if (!text) return;
  const raw = tokenize(text), tokens = markKeywords(raw), c = ' ' + canonOf(raw) + ' ';
  const cc = c.trim();
  showVoice(); $('vHeard').textContent = '“' + text + '”'; $('vHeard').classList.remove('interim'); $('vChips').innerHTML = ''; setAns('');

  // Đang chờ xác nhận
  if (pendingConfirm) {
    if (/\b(chac|dong y|ok|oke|co|xoa|dung roi|u|uh|vang|da|lam di)\b/.test(cc) && !/\b(khong|thoi|huy)\b/.test(cc)) { const p = pendingConfirm; clearConfirm(); p.yes(); return; }
    if (/\b(khong|thoi|huy|bo qua|dung lai|khoan)\b/.test(cc)) { clearConfirm(); say('Đã hủy.'); return; }
    clearConfirm();
  }
  const R = [
    [/\b(danh sach lenh|tro giup|huong dan|cac lenh|lenh gi|noi gi|cau lenh)\b/, () => { openSheet('shHelp'); say('Đây là các câu lệnh. Bấm vào câu nào để chạy thử.'); }],
    [/\b(hoan tac|undo|quay lai|tro lai|lui lai|khoi phuc)\b/, doUndo],
    [/\b(xoa|huy|bo) (dong|phieu) (\d+|cuoi|vua)\b|\bxoa phieu (vua roi|cuoi)\b/, () => {
      const ref = rowRef(cc); if (!ref || ref.miss) return say('Không có dòng ' + (ref ? ref.miss : '') + ' trong ngày ' + dmy(viewDate) + '.', null, true);
      askConfirm(`Xóa ${describe(ref.r, ref.n).replace(/^Dòng/, 'dòng')}?\nCó chắc không?`, 'Xóa dòng ' + ref.n + ', ' + readNum(ref.r.money) + ' đồng. Có chắc không?', () => { deleteRecord(ref.r); say('Đã xóa dòng ' + ref.n + '.'); });
    }],
    [/\b(xem|doc|mo xem) (dong|phieu) (\d+|cuoi|vua)\b|\b(dong|phieu) (\d+|cuoi cung|cuoi|vua roi) (bao nhieu|la bao nhieu|may|the nao)\b|^phieu (vua roi|cuoi)$/, () => {
      const ref = rowRef(cc); if (!ref || ref.miss) return say('Không tìm thấy dòng đó.', null, true);

    }],
    [/\b(sua|chinh|mo|doi) (dong|phieu) (\d+|cuoi|vua)\b|\b(dong|phieu) (\d+|cuoi cung|cuoi) (?=(tien mat|chuyen khoan|ck|chua tra|no|ghi no|gia|don gia|xe|tap chat|tru|cong|khach|ten|sat|tole|ton|lon|nhom|bi|ra|vo|ghi chu|them))/, () => {

      const rest = tokensAfterRow(tokens);
      const ops = interpret(rest, { gross: ref.r.gross, tare: ref.r.tare, price: ref.r.price });
      if (!ops.length) { loadRecord(ref.r); closeSheets(); return say('Đã mở dòng ' + ref.n + ' để sửa. Sửa xong bấm Lưu phiếu.'); }
      const f = { ...blankForm(), ...ref.r, priceAuto: false, id: ref.r.id }; const log = [];
      applyOps(ops.filter(o => o[0] !== 'save' && o[0] !== 'new'), f, log);
      const err = validate(f); if (err) return say('Không sửa được: ' + err, null, true);
      Object.assign(ref.r, recFromForm(f), { time: ref.r.time });
      if (S.form.id === ref.r.id) loadRecord(ref.r);

    }],
    [/\b(copy|cop py|sao chep|chep|gui zalo)\b/, () => copyDay(/\bhom qua\b/.test(cc) ? addDays(today(), -1) : viewDate)],
    [/\b(tat|dung|ngung) (doc|loa|am thanh|tieng|noi)\b|\bim lang\b|\bdung noi\b/, () => { S.settings.tts = false; syncSettings(); say('Đã tắt đọc to.'); }],
    [/\b(bat|mo) (doc|loa|am thanh|tieng)\b|\bdoc to\b/, () => { S.settings.tts = true; syncSettings(); say('Đã bật đọc to.'); }],
    [/\b(dung nghe|ngung nghe|tat mic|tat micro|thoi nghe|tat nghe)\b/, () => { S.settings.cont = false; syncSettings(); stopListen(); say('Đã tắt nghe liên tục.'); }],
    [/\b(nghe lien tuc|ranh tay|bat nghe|nghe hoai)\b/, () => { S.settings.cont = true; syncSettings(); say('Nghe liên tục đã bật. Nói "dừng nghe" để tắt.'); }],
    [/\b(chu to|to chu|phong to|chu lon|to len)\b/, () => { fontStep(0.1); say('Chữ to hơn.'); }],
    [/\b(chu nho|nho chu|thu nho|nho lai)\b/, () => { fontStep(-0.1); say('Chữ nhỏ hơn.'); }],

    [/\b(tuong phan thuong|tat tuong phan)\b/, () => { S.settings.hc = false; syncSettings(); say('Đã tắt tương phản cao.'); }],
    [/\b(che do nang|nang gat|ngoai nang|troi nang|mau trang)\b/, () => say('Giao diện ' + setTheme('nang') + '.')],
    [/\b(diu mat|mau diu|bot choi|do choi|choi mat qua|mau nga|mau giay)\b/, () => say('Giao diện ' + setTheme('diu') + '.')],
    [/\b(mau xam|xam nhe|xam xanh)\b/, () => say('Giao diện ' + setTheme('xam') + '.')],

    [/\b(thu giong|kiem tra giong|giong doc)\b/, testVoice],
    [/\b(mo|xem) (danh sach|bang ke|so|phieu da luu)\b|\bdanh sach (hom nay|phieu)\b/, () => { viewDate = /\bhom qua\b/.test(cc) ? addDays(today(), -1) : today(); openSheet('shList'); say('Danh sách ' + dmy(viewDate) + '.'); }],
    [/\b(mo )?cai dat\b/, () => { openSheet('shSet'); say('Mở cài đặt.'); }],
    [/\b(dong lai|dong bang|thoat|an bang|ve man hinh chinh|tro ve)\b/, () => { closeSheets(); say('Đã đóng.'); }],
    [/\bdat gia\b/, () => {
      const it = itemIn(tokens); const nt = tokens.find(t => t.k === 'num');
      if (!it || !nt) return say('Nói rõ mặt hàng và giá, VD: đặt giá sắt 8500.', null, true);
      const v = normPrice(nt); setPrice(it, v); say('Giá hiện tại ' + ITEM_NAME[it] + ': ' + fmt(v) + ' đ/kg', 'Đã đặt giá ' + ITEM_NAME[it] + ' ' + readNum(v));
    }],
    [/\bbang gia\b|\bgia (sat dac|sat|tole|ton|lon|nhom|dac)( hien tai| hom nay| bay gio)? (bao nhieu|la bao nhieu|may|nhieu)\b/, () => {
      const it = itemIn(tokens);
      if (it) return say(ITEM_NAME[it] + ': ' + fmt(S.prices[it]) + ' đ/kg', 'Giá ' + ITEM_NAME[it] + ' ' + readNum(S.prices[it]));
      say(ITEMS.map(i => i.name + ': ' + fmt(S.prices[i.id])).join('\n'), ITEMS.map(i => i.name + ' ' + readNum(S.prices[i.id])).join(', '));
    }],
    [/\btinh (\d+(?:\.\d+)?) (nhan|x|lan|cong|tru|chia) (\d+(?:\.\d+)?)/, m => {
      const a = +m[1], b = +m[3], op = m[2]; const v = op === 'cong' ? a + b : op === 'tru' ? a - b : op === 'chia' ? a / b : a * b;
      const r = Math.round(v * 100) / 100; say(fmt(a) + ' ' + ({ cong: '+', tru: '−', chia: '÷' }[op] || '×') + ' ' + fmt(b) + ' = ' + fmt(r), 'Bằng ' + readDec(r));
    }],
    [/\b(luu khach|nho khach|them khach nay|luu xe nay)\b/, () => {
      const f = S.form; if (!normPlate(f.plate) || !f.name.trim()) return say('Cần có biển số và tên khách trước khi lưu khách.', null, true);
      rememberCustomer(f, true); persist(); renderCusts(); say('Đã lưu khách ' + f.name + ' · xe ' + normPlate(f.plate) + (num(f.tare) != null ? ' · KL xe ' + fmt(f.tare) : ''));
    }],
    [/\b(dao|doi cho|doi) (so|xe vo xe ra|vo ra|lai so|nguoc)\b|\bdao nguoc\b|\bnguoc roi\b/, () => { pushUndo(); const f = S.form; [f.gross, f.tare] = [f.tare, f.gross]; renderForm(['gross', 'tare']); say('Đã đảo KL xe hàng và KL xe.'); }],
    [/\bxoa (gia|don gia|bien so|so xe|khach|ten|tap chat|ghi chu|xe vo|xe ra|kl xe hang|kl xe)\b/, m => {
      pushUndo(); const f = S.form, k = m[1];
      const map = { gia: ['price'], 'don gia': ['price'], 'bien so': ['plate'], 'so xe': ['plate'], khach: ['name'], ten: ['name'], 'tap chat': ['tcPct', 'tcKg'], 'ghi chu': ['note', 'noteKind'], 'xe vo': ['gross'], 'kl xe hang': ['gross'], 'xe ra': ['tare'], 'kl xe': ['tare'] }[k];
      map.forEach(x => f[x] = ''); if (k.includes('gia')) f.priceAuto = false; renderForm(map); say('Đã xóa ' + k.replace('gia', 'giá') + '.');
    }],
    [/\b(doc lai|doc phieu|kiem tra phieu|nhac lai|phieu nay the nao)\b/, readForm],
    [/\b(tong|thanh tien|tien)\b.*\b(phieu nay|dang nhap|xe nay)\b|\b(doc tong|doc tien|tong phieu|het bao nhieu|tinh tien)\b|^(bao nhieu tien|tong bao nhieu|thanh tien bao nhieu|tong tien)$/, readTotal],
    [/\b(kl thuc|ky thuc|khoi luong thuc|hang thuc|tinh ra bao nhieu ky)\b/, () => { const r = calc(S.form); if (r.net == null) return say('Chưa đủ KL xe hàng và KL xe.', null, true); say('KL thực ' + fmt(r.net) + ' kg (tạp chất ' + fmt(r.tc) + ' kg)', readNum(r.net) + ' ký'); }],
    [/\b(tong ket cuoi ngay|chot so|bao cao cuoi ngay|tong ket hom nay|chot ngay|dong so hom nay)\b/, () => {
      const rs = recsOf(today()), st = stats(rs);
      if (!rs.length) return say('Hôm nay chưa có phiếu nào.', null, true);
      say(`TỔNG KẾT ${dmy(today())}\n${st.n} phiếu · KL thực ${fmt(st.net)} kg\nTiền mặt ${fmt(st.cash)} đ · Chuyển khoản ${fmt(st.ck)} đ · Còn nợ ${fmt(st.debt)} đ\nTổng cộng ${fmt(st.money)} đ`,
        `Hôm nay ${st.n} phiếu, tổng ${readNum(st.money)} đồng. Tiền mặt ${readNum(st.cash)} đồng, chuyển khoản ${readNum(st.ck)} đồng, còn nợ ${readNum(st.debt)} đồng.`);
    }],
  ];
  for (const [re, fn] of R) { const m = cc.match(re); if (m) { fn(m); return; } }

  // Câu hỏi báo cáo
  const q = /\b(bao nhieu|may|tong cong|thong ke|bao cao|con no|cong no|nhieu nhat|lon nhat|trung binh|so voi|ai no)\b/.test(cc);
  if (q && (rangeOf(cc) || /\b(con no|cong no|chua tra|ai no|so voi|nhieu nhat|lon nhat|trung binh|chuyen|khach)\b/.test(cc) || custIn(cc) || /\bxe \d{3,}/.test(cc))) {
    const [show, tts] = report(cc, tokens); say(show, tts); return;
  }
  if (/^(bao nhieu tien|het bao nhieu|bao nhieu)$/.test(cc)) return readTotal();

  // Điền phiếu
  const ops = interpret(tokens, S.form);
  if (!ops.length || ops.every(o => o[0] === 'unknown')) { say('Chưa hiểu câu này. Thử: "xe vô 3200 xe ra 2200 giá 8400", hoặc nói "danh sách lệnh".', 'Chưa hiểu, nói lại giúp', true); return; }
  pushUndo();
  const log = [], res = applyOps(ops, S.form, log);
  renderForm([...res.changed]); showChips(log);
  if (res.save) { saveForm(); return; }
  const r = calc(S.form);
  if (r.money != null) say(`${fmt(r.net)} kg × ${fmt(S.form.price)} = ${fmt(r.money)} đ`, readNum(r.money) + ' đồng');
  else { const miss = validate(S.form); say(miss ? miss.replace('Thiếu', 'Còn thiếu') : '', log.filter(x => !x[1]).map(x => x[0]).slice(-2).join(', ')); }
}
function readTotal() {
  const r = calc(S.form);
  if (r.money == null) return say(validate(S.form) || 'Chưa đủ số để tính.', null, true);
  say(`${ITEM_NAME[S.form.item]} ${fmt(r.net)} kg × ${fmt(S.form.price)} = ${fmt(r.money)} đ`, readNum(r.net) + ' ký, thành tiền ' + readNum(r.money) + ' đồng');
}
function readForm() {
  const f = S.form, r = calc(f);
  const parts = [f.plate && 'Xe ' + f.plate, f.name && 'Khách ' + f.name, f.item && ITEM_NAME[f.item], f.gross !== '' && 'Vô ' + fmt(f.gross), f.tare !== '' && 'Ra ' + fmt(f.tare),
    (f.tcPct !== '' || f.tcKg !== '') && 'TC ' + fmt(f.tcPct || 0) + '% + ' + fmt(f.tcKg || 0) + ' kg', f.price !== '' && 'Giá ' + fmt(f.price), f.noteKind && NOTE_LBL[f.noteKind], r.money != null && '= ' + fmt(r.money) + ' đ'].filter(Boolean);
  if (!parts.length) return say('Phiếu đang trống.');
  const tts = [f.plate && 'xe ' + f.plate.split('').join(' '), f.name, f.item && ITEM_NAME[f.item], f.gross !== '' && 'vô ' + readNum(f.gross), f.tare !== '' && 'ra ' + readNum(f.tare),
    f.tcPct !== '' && 'tạp chất ' + readDec(f.tcPct) + ' phần trăm', f.tcKg && 'trừ ' + readNum(f.tcKg) + ' ký', f.price !== '' && 'giá ' + readNum(f.price), r.money != null && 'thành tiền ' + readNum(r.money) + ' đồng'].filter(Boolean).join(', ');
  say(parts.join(' · '), tts);
}
function doUndo() {

/* ---- khung giọng nói ---- */
function showVoice() { $('voice').classList.add('on'); }

/* ---- đọc to: chỉ dùng giọng tiếng Việt ---- */
let viVoice = null, allVoices = [], speaking = false, speakQ = [], netAudio = null, warnedNoVoice = false;
const isVi = v => /^vi([-_]|$)/i.test(v.lang) || /vietnam|việt|tiếng việt/i.test(v.name);
/* Ưu tiên: giọng đã chọn tay > giọng chạy offline trên máy (ổn định, không cần mạng) >
   giọng nữ Google chất lượng tốt > giọng Google bất kỳ > giọng đầu tiên có sẵn */
function voiceScore(v) {
  return (v.localService ? 100 : 0) + (/google/i.test(v.name) ? 10 : 0) + (/nữ|female|linh|mai|an\b|hoai/i.test(v.name) ? 1 : 0);
}
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  allVoices = speechSynthesis.getVoices();
  const vi = allVoices.filter(isVi);
  viVoice = vi.find(v => v.name === S.settings.voiceName) || [...vi].sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
  renderVoiceUI();
}
if ('speechSynthesis' in window) {
  pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;
  let tries = 0; const t = setInterval(() => { if (viVoice || ++tries > 20) clearInterval(t); pickVoice(); }, 300); // Android nạp giọng chậm
}
function voiceHelpText() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return ios ? 'Cài giọng Việt: Cài đặt iPhone → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Việt → tải giọng Linh. Xong mở lại trang.'
    : 'Cài giọng Việt: Cài đặt Android → Hệ thống → Ngôn ngữ → Đầu ra chuyển văn bản thành giọng nói → Công cụ Google → Cài đặt → Cài đặt dữ liệu giọng nói → Tiếng Việt. Xong mở lại trang.';
}
function renderVoiceUI() {
  const sel = $('sVoice'); if (!sel) return;
  const vi = allVoices.filter(isVi);
  sel.innerHTML = vi.length ? vi.map(v => `<option value="${esc(v.name)}"${viVoice && v.name === viVoice.name ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')
    : '<option value="">Máy chưa có giọng tiếng Việt</option>';
  sel.disabled = !vi.length;
  $('sVoiceInfo').innerHTML = vi.length ? `<div class="vok">Đang đọc bằng giọng Việt: ${esc(viVoice.name)}</div>`
    : `<div class="vwarn">Máy chưa có giọng tiếng Việt nên app sẽ không đọc bằng giọng tiếng Anh.${S.settings.netVoice ? '\nĐang dùng giọng Việt qua mạng (Google).' : '\nBật "đọc qua mạng" ở trên, hoặc:'}\n${voiceHelpText()}</div>`;
}
function cleanTts(text) { return String(text).replace(/\n/g, '. ').replace(/[•·]/g, ',').replace(/(\d)\.(?=\d{3})/g, '$1').replace(/×/g, ' nhân ').replace(/−/g, ' trừ ').replace(/=/g, ' bằng ').replace(/\bđ\b/g, ' đồng').replace(/\bkg\b/g, ' ký'); }
function stopSpeak() { if ('speechSynthesis' in window) speechSynthesis.cancel(); if (netAudio) { netAudio.onended = netAudio.onerror = null; netAudio.pause(); netAudio = null; } speaking = false; }
function speak(text) {
  if (!S.settings.tts || !text) { flushSpeak(); return; }
  const t = cleanTts(text);
  stopSpeak();
  if (viVoice) {
    const u = new SpeechSynthesisUtterance(t);
    u.voice = viVoice; u.lang = viVoice.lang; u.rate = Number(S.settings.rate) || 1;
    speaking = true; u.onend = u.onerror = () => { speaking = false; flushSpeak(); };
    speechSynthesis.speak(u); return;
  }
  if (S.settings.netVoice) { speakNet(t); return; }
  if (!warnedNoVoice) { warnedNoVoice = true; toast('Máy chưa có giọng đọc tiếng Việt — xem Cài đặt › Giọng đọc', true); }
  flushSpeak();
}
function speakNet(t) {
  const parts = []; let cur = '';
  t.split(/(?<=[,.;])\s+|\s+/).forEach(w => { if ((cur + ' ' + w).trim().length > 180) { parts.push(cur.trim()); cur = w; } else cur += ' ' + w; });
  if (cur.trim()) parts.push(cur.trim());
  let i = 0; speaking = true;
  const next = () => {
    if (i >= parts.length) { speaking = false; netAudio = null; flushSpeak(); return; }
    const a = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=' + encodeURIComponent(parts[i++]));
    a.playbackRate = Number(S.settings.rate) || 1; netAudio = a;
    a.onended = next;
    a.onerror = () => { speaking = false; netAudio = null; toast('Không đọc qua mạng được (mất mạng hoặc bị chặn)', true); flushSpeak(); };
    a.play().catch(a.onerror);
  };
  next();
}
function afterSpeak(fn) { if (speaking) speakQ.push(fn); else setTimeout(fn, 50); }
function flushSpeak() { const q = speakQ; speakQ = []; q.forEach(f => setTimeout(f, 250)); }

/* ---- màu giao diện ---- */
const THEMES = [
  { id: 'nang', name: 'Nắng gắt', d: 'Trắng đen, rõ nhất ngoài trời', a: '#FFFFFF', b: '#FFD100', meta: '#FFD100' },
  { id: 'diu', name: 'Dịu mắt', d: 'Giấy ngà, vàng nhạt', a: '#F1ECE1', b: '#E3C77E', meta: '#E3C77E' },
  { id: 'xam', name: 'Xám nhẹ', d: 'Xám xanh, không chói', a: '#E3E6E9', b: '#B7CCDC', meta: '#B7CCDC' },
  { id: 'la', name: 'Lá dịu', d: 'Xanh lá nhạt', a: '#E5ECE1', b: '#BFD6AE', meta: '#BFD6AE' },
  { id: 'toi', name: 'Tối', d: 'Trong nhà, buổi tối', a: '#1C1E21', b: '#C9A646', meta: '#1C1E21' },

function applyTheme() {

  if (box) box.innerHTML = THEMES.map(x => `<button class="theme" data-theme="${x.id}" aria-pressed="${x.id === t.id}" style="--a:${x.a};--b:${x.b}"><i></i><span>${x.name}<small>${x.d}</small></span></button>`).join('');

/* ---- nhận giọng nói ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, manualStop = false;
function startListen(once) {
  showVoice();
  if (!SR) { $('vStatus').textContent = 'Máy này không nhận giọng nói — gõ lệnh ở ô dưới'; setAns('Dùng Chrome (Android) hoặc Safari (iPhone), mở trang qua https để dùng micro.', true); return; }
  if (listening) return;
  if (speaking) stopSpeak();
  rec = new SR(); rec.lang = 'vi-VN'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  manualStop = false; listening = true; $('btnMic').classList.add('on'); $('vStatus').textContent = pendingConfirm ? 'Đang nghe câu trả lời…' : 'Đang nghe… nói xong im 1 giây';
  let finalText = '';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += t; else interim += t; }
    if (interim) { $('vHeard').textContent = interim; $('vHeard').classList.add('interim'); }
  };
  rec.onerror = e => {
    const m = { 'not-allowed': 'Chưa cho phép micro. Cấp quyền micro cho trang, và mở trang qua https.', 'service-not-allowed': 'Trình duyệt chặn nhận giọng nói. Mở trang qua https.', 'no-speech': 'Không nghe thấy gì. Bấm micro rồi nói to, gần máy.', network: 'Cần mạng để nhận giọng nói. Gõ lệnh ở ô dưới nếu mất mạng.', 'audio-capture': 'Không tìm thấy micro.' }[e.error];
    if (m && e.error !== 'aborted') { setAns(m, true); if (e.error !== 'no-speech') { S.settings.cont = false; syncSettings(); } }
  };
  rec.onend = () => {
    listening = false; $('btnMic').classList.remove('on'); $('vStatus').textContent = S.settings.cont ? 'Nghe liên tục — nói "dừng nghe" để tắt' : 'Bấm micro để nói tiếp';
    if (finalText.trim()) handle(finalText);
    if (S.settings.cont && !manualStop) afterSpeak(() => { if (S.settings.cont && !listening) startListen(); });
  };
  try { rec.start(); } catch (e) { listening = false; $('btnMic').classList.remove('on'); }
}
function stopListen() { manualStop = true; if (rec && listening) rec.stop(); }

function renderHelp() {
  $('hBody').innerHTML = '<p>Nói số bằng chữ hay bằng số đều được: "ba ngàn hai" = 3.200, "tám tư" = 8.400 (khi nói giá), "1 chấm 5" = 1,5. Bấm vào câu để chạy thử.</p>' +
    HELP.map(([h, l]) => `<h3>${h}</h3>` + l.map(([s, d]) => `<button data-run="${esc(s)}">“${esc(s)}”<span>${esc(d)}</span></button>`).join('')).join('');
}

/* ---- thông báo ---- */
let toastT;
function toast(t, err) { const el = $('toast'); el.textContent = t; el.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => el.className = 'toast', 2600); }

/* ---- gắn sự kiện ---- */
function bind() {
  $('items').innerHTML = ITEMS.map(i => `<button class="item" data-id="${i.id}" aria-pressed="false">${i.name}</button>`).join('');
  $('items').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; S.form.item = b.dataset.id; autoPrice(S.form); renderForm(['price']); };
  const onNum = (k, dec) => $(k).addEventListener('input', e => {
    let v = e.target.value;
    v = dec ? v.replace(/[^\d,.]/g, '').replace(',', '.') : v.replace(/\D/g, '');
    S.form[k] = v === '' ? '' : (dec ? v : Number(v));
    if (k === 'price') S.form.priceAuto = false;
    if (dec && e.target.value !== e.target.value.replace(/[^\d,.]/g, '')) e.target.value = e.target.value.replace(/[^\d,.]/g, '');
    if (!dec && /\D/.test(e.target.value)) e.target.value = v;
    if ((k === 'gross' || k === 'tare') && !S.form.item) { S.form.item = 'sat'; autoPrice(S.form); renderForm(); return; }
    if (k === 'tcPct') document.querySelectorAll('[data-tc]').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.tc) === Number(S.form.tcPct)));
    renderCalc();
  });
  ['gross', 'tare', 'tcKg', 'price'].forEach(k => onNum(k)); onNum('tcPct', true);
  ['gross', 'tare'].forEach(k => $(k).addEventListener('blur', renderCalc));
  $('plate').addEventListener('input', e => { S.form.plate = e.target.value.toUpperCase(); showSug(); renderCalc(); });
  $('plate').addEventListener('focus', showSug);
  $('plate').addEventListener('blur', () => setTimeout(() => { $('sug').classList.remove('on'); const p = normPlate(S.form.plate); if (p) { const log = []; const hit = findCustByPlate(p); S.form.plate = p; if (hit) applyPlate(S.form, p, log); renderForm(['name', 'tare']); } }, 180));
  $('sug').addEventListener('pointerdown', e => { const b = e.target.closest('[data-p]'); if (!b) return; e.preventDefault(); const c = plateCandidates(b.dataset.p).find(x => x.p === b.dataset.p) || {};
    S.form.plate = b.dataset.p; if (c.name) S.form.name = c.name; if (c.tare && S.form.tare === '') S.form.tare = c.tare; autoPrice(S.form); $('sug').classList.remove('on'); renderForm(['plate', 'name', 'tare', 'price']); $('gross').focus(); });
  $('name').addEventListener('input', e => { S.form.name = e.target.value; renderCalc(); });
  $('name').addEventListener('blur', () => { const c = findCustByName(S.form.name); if (c && c.name !== S.form.name) { applyName(S.form, c.name); renderForm(['name', 'plate', 'tare', 'price']); } else { autoPrice(S.form); renderForm(); } });
  $('note').addEventListener('input', e => { S.form.note = e.target.value; persist(); });
  document.querySelectorAll('[data-tc]').forEach(b => b.onclick = () => { S.form.tcPct = Number(b.dataset.tc); if (b.dataset.tc === '0') S.form.tcKg = ''; renderForm(['tcPct']); });
  $('pay').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; S.form.noteKind = S.form.noteKind === b.dataset.k ? '' : b.dataset.k; renderForm(); };
  const order = ['plate', 'name', 'gross', 'tare', 'tcPct', 'tcKg', 'price', 'note'];
  order.forEach((k, i) => $(k).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const n = order[i + 1]; if (n) $(n).focus(); else $(k).blur(); } }));
  $('btnSave').onclick = saveForm;
  $('btnClear').onclick = () => { pushUndo(); S.form = blankForm(); renderForm(['all']); toast('Đã làm trống. Nói "hoàn tác" để lấy lại.'); };
  $('btnCancelEdit').onclick = () => { S.form = blankForm(); renderForm(['all']); };
  $('btnMic').onclick = () => { if (listening) { stopListen(); } else startListen(); };
  $('vClose').onclick = () => { stopListen(); $('voice').classList.remove('on'); clearConfirm(); };
  $('vSend').onclick = () => { const v = $('vInput').value; $('vInput').value = ''; handle(v); };
  $('vInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('vSend').click(); } });
  $('vUndo').onclick = doUndo; $('vHelp').onclick = () => openSheet('shHelp');
  $('vCont').onclick = () => { S.settings.cont = !S.settings.cont; syncSettings(); if (S.settings.cont) startListen(); else stopListen(); };
  $('vYes').onclick = () => { const p = pendingConfirm; clearConfirm(); p && p.yes(); };
  $('vNo').onclick = () => { clearConfirm(); say('Đã hủy.'); };
  $('btnList').onclick = () => { viewDate = today(); openSheet('shList'); };
  $('btnSet').onclick = () => openSheet('shSet');
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { closeSheets(); if (b.closest('#shCust')) openSheet('shSet'); });
  $('dPrev').onclick = () => { viewDate = addDays(viewDate, -1); renderList(); };
  $('dNext').onclick = () => { viewDate = addDays(viewDate, 1); renderList(); };
  $('dPick').onchange = e => { if (e.target.value) { viewDate = e.target.value; renderList(); } };
  $('lToday').onclick = () => { viewDate = today(); renderList(); };
  $('lCopy').onclick = () => copyDay(viewDate);
  $('lFilter').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; listFilter = b.dataset.f; [...$('lFilter').children].forEach(x => x.setAttribute('aria-pressed', x === b)); renderList(); };
  $('lRows').onclick = e => {
    const d = e.target.closest('[data-del]');
    if (d) { const r = S.records.find(x => x.id === d.dataset.del); const n = recsOf(r.date).indexOf(r) + 1; if (confirm('Xóa dòng ' + n + ' (' + fmt(r.money) + ' đ)?')) { deleteRecord(r); toast('Đã xóa dòng ' + n); } return; }
    const row = e.target.closest('[data-id]'); if (row) { loadRecord(S.records.find(x => x.id === row.dataset.id)); closeSheets(); toast('Đang sửa phiếu — sửa xong bấm Lưu phiếu'); }
  };
  $('sPrices').addEventListener('input', e => { const k = e.target.dataset.pr; if (!k) return; const v = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0; setPrice(k, v); });
  ['sTts', 'sCont', 'sHc', 'sAutoCust'].forEach(id => $(id).onchange = e => { S.settings[{ sTts: 'tts', sCont: 'cont', sHc: 'hc', sAutoCust: 'autoCust' }[id]] = e.target.checked; syncSettings(); });
  $('sThemes').onclick = e => { const b = e.target.closest('[data-theme]'); if (b) setTheme(b.dataset.theme); };
  $('sVoice').onchange = e => { S.settings.voiceName = e.target.value; pickVoice(); persist(); testVoice(); };
  $('sRate').onchange = e => { S.settings.rate = Number(e.target.value); persist(); testVoice(); };
  $('sNet').onchange = e => { S.settings.netVoice = e.target.checked; renderVoiceUI(); persist(); if (e.target.checked) testVoice(); };
  $('sTestVoice').onclick = testVoice;
  $('sSmall').onclick = () => fontStep(-0.1); $('sBig').onclick = () => fontStep(0.1);
  $('sFind').oninput = renderCusts;
  $('sAddCust').onclick = () => openCust(null);
  $('sCusts').onclick = e => { const b = e.target.closest('[data-cust]'); if (b) openCust(b.dataset.cust); };
  $('cSave').onclick = saveCust;
  $('cDel').onclick = () => { const c = S.customers.find(x => x.id === editingCust); if (c && confirm('Xóa khách ' + c.name + '?')) { S.customers = S.customers.filter(x => x !== c); persist(); openSheet('shSet'); } };
  $('sExport').onclick = () => {
    const blob = new Blob([JSON.stringify({ prices: S.prices, customers: S.customers, records: S.records, settings: S.settings }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'CanNhanh_' + today().split('-').reverse().join('') + '.json'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('sImport').onclick = () => $('sFile').click();
  $('sFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.records || !d.customers) throw 0;
      if (!confirm(`Nhập ${d.records.length} phiếu, ${d.customers.length} khách? Dữ liệu hiện tại sẽ bị thay.`)) return;
      Object.assign(S, { prices: d.prices || S.prices, customers: d.customers, records: d.records, settings: { ...S.settings, ...(d.settings || {}) } }); persist(); syncSettings(); renderCount(); openSheet('shSet'); toast('Đã nhập dữ liệu');
    } catch (_) { toast('File không đúng định dạng sao lưu', true); }
    e.target.value = '';
  };
  $('sWipe').onclick = () => { if (confirm('Xóa hết phiếu và khách trên máy này?') && confirm('Chắc chắn? Không lấy lại được nếu chưa xuất file.')) { S.records = []; S.customers = []; S.form = blankForm(); persist(); renderForm(['all']); renderCount(); renderCusts(); } };
  $('hBody').onclick = e => { const b = e.target.closest('[data-run]'); if (b) { closeSheets(); handle(b.dataset.run); } };
  document.addEventListener('keydown', e => { if (e.key === 'F8') { e.preventDefault(); $('btnMic').click(); } if (e.key === 'Escape') { closeSheets(); $('voice').classList.remove('on'); } });
}
function showSug() {
  const q = S.form.plate, box = $('sug');
  const c = q ? plateCandidates(q) : [];
  if (!c.length || (c.length === 1 && c[0].p === normPlate(q))) { box.classList.remove('on'); return; }
  box.innerHTML = c.map(x => `<button type="button" data-p="${x.p}">${x.p}<span>${esc(x.name || '')}${x.tare ? ' · xe ' + fmt(x.tare) : ''}</span></button>`).join('');
  box.classList.add('on');
}

load(); bind(); renderHelp(); syncSettings(); renderForm(); renderCount();
if (S.settings.cont) $('vStatus').textContent = 'Nghe liên tục đang bật — bấm micro để bắt đầu';
</script>
